<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Cuộc Họp</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 13px;
        }

        .content {
            padding: 30px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group.read-only input {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .info {
            background: #e7f3ff;
            color: #0c5aa0;
            border-left: 4px solid #2196F3;
        }

        .loading {
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .qr-input {
            font-size: 16px !important;
            padding: 15px !important;
            text-align: center;
        }

        .instruction {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #555;
            font-size: 13px;
            border-left: 4px solid #667eea;
        }

        .meeting-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
        }

        .meeting-info strong {
            color: #333;
        }

        .edit-notice {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Điểm Danh Cuộc Họp</h1>
            <p id="headerSubtitle">Đảng ủy phường Trị An</p>
        </div>

        <div class="content">
            <!-- QR Scan Section -->
            <div class="section active" id="qrSection">
                <div class="instruction">
                    📱 Quét mã QR từ màn hình hoặc nhập thủ công
                </div>

                <div class="message error" id="qrError"></div>
                <div class="message success" id="qrSuccess"></div>
                <div class="message info" id="qrInfo"></div>

                <div class="form-group">
                    <label for="qrInput">Mã QR hoặc Meeting ID:</label>
                    <input type="text" id="qrInput" class="qr-input" 
                           placeholder="Quét mã QR..." autofocus
                           onchange="processQR()" 
                           onkeypress="if(event.key==='Enter') processQR()">
                </div>

                <button onclick="processQR()">✅ Xác Nhận Mã QR</button>
            </div>

            <!-- Form Section -->
            <div class="section" id="formSection">
                <div class="edit-notice" id="editNotice" style="display: none;">
                    ℹ️ Bạn đã điểm danh rồi. Có thể chỉnh sửa thông tin nếu sai.
                </div>

                <div class="meeting-info" id="meetingInfo"></div>

                <div class="message error" id="formError"></div>
                <div class="message success" id="formSuccess"></div>

                <div class="form-group">
                    <label for="fullName">👤 Họ Tên:</label>
                    <input type="text" id="fullName" placeholder="Nhập họ tên" required>
                </div>

                <div class="form-group">
                    <label for="position">💼 Chức Vụ:</label>
                    <input type="text" id="position" placeholder="VD: Phó Sở Trưởng">
                </div>

                <div class="form-group">
                    <label for="department">🏢 Đơn Vị:</label>
                    <input type="text" id="department" placeholder="VD: Sở XYZ">
                </div>

                <button onclick="submitForm()">📤 Gửi Thông Tin</button>
                <button class="btn-secondary" onclick="startOver()">🔄 Quét Mã Khác</button>
            </div>

            <!-- Loading Section -->
            <div class="section" id="loadingSection">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Đang xử lý...</p>
                </div>
            </div>

            <!-- Success Section -->
            <div class="section" id="successSection">
                <div style="text-align: center;">
                    <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
                    <h2 style="color: #28a745; margin-bottom: 15px;">Điểm Danh Thành Công!</h2>
                    <div class="meeting-info">
                        <div><strong>Họ tên:</strong> <span id="successName"></span></div>
                        <div><strong>Chức vụ:</strong> <span id="successPosition"></span></div>
                        <div><strong>Đơn vị:</strong> <span id="successDepartment"></span></div>
                        <div><strong>Thời gian:</strong> <span id="successTime"></span></div>
                    </div>
                    <button onclick="startOver()">🔄 Quét Lần Tiếp Theo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/usercontent/v1/send';
        let currentMeetingConfig = null;
        let checkInData = null;
        let isEditMode = false;

        // Get meeting config from URL or localStorage
        function loadMeetingConfig() {
            const params = new URLSearchParams(window.location.search);
            const meetingID = params.get('meeting');
            
            if (meetingID) {
                localStorage.setItem('currentMeetingID', meetingID);
            }
            
            const saved = localStorage.getItem('meetingConfig');
            if (saved) {
                currentMeetingConfig = JSON.parse(saved);
                document.getElementById('headerSubtitle').textContent = currentMeetingConfig.unitName;
            }
        }

        function processQR() {
            const qrInput = document.getElementById('qrInput').value.trim();
            
            if (!qrInput) {
                showMessage('qrError', '❌ Vui lòng quét hoặc nhập mã QR');
                return;
            }

            if (!currentMeetingConfig) {
                showMessage('qrError', '❌ Chưa cấu hình cuộc họp. Vui lòng liên hệ admin.');
                return;
            }

            // Validate GPS
            validateGPS(qrInput);
        }

        function validateGPS(meetingID) {
            showSection('loadingSection');
            
            if (!navigator.geolocation) {
                showMessage('formError', '❌ Thiết bị không hỗ trợ GPS');
                showSection('qrSection');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    
                    const coords = currentMeetingConfig.coordinates.split(',');
                    const venueLat = parseFloat(coords[0]);
                    const venueLng = parseFloat(coords[1]);
                    
                    const distance = calculateDistance(userLat, userLng, venueLat, venueLng);
                    
                    if (distance <= 150) {
                        checkIfAlreadyCheckedIn(meetingID);
                    } else {
                        showMessage('formError', 
                            `❌ Bạn ở cách hội trường ${Math.round(distance)}m. ` +
                            `Phạm vi cho phép: 150m`);
                        showSection('qrSection');
                    }
                },
                (error) => {
                    showMessage('formError', '❌ Không thể lấy vị trí GPS. Vui lòng bật GPS và thử lại.');
                    showSection('qrSection');
                }
            );
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                    Math.cos(φ1) * Math.cos(φ2) *
                    Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function checkIfAlreadyCheckedIn(meetingID) {
            // Call Google Apps Script to check
            fetch(GOOGLE_APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'checkAttendance',
                    meetingID: meetingID
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.alreadyCheckedIn) {
                    isEditMode = true;
                    checkInData = data.data;
                    showEditForm(meetingID, data.data);
                } else {
                    isEditMode = false;
                    checkInData = null;
                    showCheckInForm(meetingID);
                }
            })
            .catch(error => {
                console.log('Note: Google Apps Script not yet configured, allowing check-in');
                isEditMode = false;
                showCheckInForm(meetingID);
            });
        }

        function showCheckInForm(meetingID) {
            checkInData = { meetingID, timestamp: new Date().toISOString() };
            document.getElementById('editNotice').style.display = 'none';
            displayMeetingInfo();
            showSection('formSection');
            document.getElementById('fullName').focus();
        }

        function showEditForm(meetingID, data) {
            checkInData = data;
            document.getElementById('editNotice').style.display = 'block';
            document.getElementById('fullName').value = data.fullName || '';
            document.getElementById('position').value = data.position || '';
            document.getElementById('department').value = data.department || '';
            displayMeetingInfo();
            showSection('formSection');
            document.getElementById('fullName').focus();
        }

        function displayMeetingInfo() {
            const date = new Date(currentMeetingConfig.meetingDate).toLocaleDateString('vi-VN');
            const html = `
                <strong>📅 ${date} - ${currentMeetingConfig.meetingTime}</strong><br>
                ${currentMeetingConfig.meetingTitle}<br>
                📍 ${currentMeetingConfig.location}
            `;
            document.getElementById('meetingInfo').innerHTML = html;
        }

        function submitForm() {
            const fullName = document.getElementById('fullName').value.trim();
            const position = document.getElementById('position').value.trim();
            const department = document.getElementById('department').value.trim();

            if (!fullName) {
                showMessage('formError', '❌ Vui lòng nhập họ tên');
                return;
            }

            showSection('loadingSection');

            const payload = {
                action: 'submitAttendance',
                meetingID: checkInData.meetingID,
                fullName: fullName,
                position: position,
                department: department,
                timestamp: new Date().toLocaleString('vi-VN'),
                isEdit: isEditMode
            };

            fetch(GOOGLE_APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                showSuccessSection(fullName, position, department);
            })
            .catch(error => {
                console.log('Note: Google Apps Script not configured, simulating success');
                showSuccessSection(fullName, position, department);
            });
        }

        function showSuccessSection(name, position, department) {
            document.getElementById('successName').textContent = name;
            document.getElementById('successPosition').textContent = position || 'N/A';
            document.getElementById('successDepartment').textContent = department || 'N/A';
            document.getElementById('successTime').textContent = new Date().toLocaleTimeString('vi-VN');
            showSection('successSection');
        }

        function startOver() {
            document.getElementById('qrInput').value = '';
            document.getElementById('fullName').value = '';
            document.getElementById('position').value = '';
            document.getElementById('department').value = '';
            showSection('qrSection');
            document.getElementById('qrInput').focus();
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function showMessage(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // Enter key to process QR
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('qrSection').classList.contains('active')) {
                processQR();
            } else if (e.key === 'Enter' && document.getElementById('formSection').classList.contains('active')) {
                submitForm();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            loadMeetingConfig();
        });
    </script>
</body>
</html>
