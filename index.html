<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hệ Thống Điểm Danh QR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 13px;
        }

        .content {
            padding: 30px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .info {
            background: #e7f3ff;
            color: #0c5aa0;
            border-left: 4px solid #2196F3;
        }

        .qr-display {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }

        .qr-display.show {
            display: block;
        }

        .qr-display img {
            max-width: 100%;
            height: auto;
            border: 2px solid #667eea;
            border-radius: 6px;
            padding: 10px;
            background: white;
        }

        .qr-display p {
            margin-top: 15px;
            color: #555;
            font-size: 13px;
        }

        .qr-display .qr-url {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            font-size: 11px;
            margin-top: 10px;
            color: #333;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group button {
            margin: 0;
        }

        @media (max-width: 600px) {
            .button-group {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <p>Hệ Thống Điểm Danh QR - Đảng ủy phường Trị An</p>
        </div>

        <div class="content">
            <!-- Login Section -->
            <div class="section active" id="loginSection">
                <h2 style="margin-bottom: 25px; color: #333;">Đăng Nhập Admin</h2>
                
                <div class="message error" id="loginError"></div>

                <div class="form-group">
                    <label for="adminPassword">Mật Khẩu Admin:</label>
                    <input type="password" id="adminPassword" placeholder="Nhập mật khẩu" 
                           onkeypress="if(event.key==='Enter') checkPassword()">
                </div>

                <button onclick="checkPassword()">🔓 Đăng Nhập</button>
            </div>

            <!-- Admin Panel Section -->
            <div class="section" id="adminSection">
                <h2 style="margin-bottom: 25px; color: #333;">⚙️ Cấu Hình Cuộc Họp</h2>

                <div class="message error" id="configError"></div>
                <div class="message success" id="configSuccess"></div>

                <div class="form-group">
                    <label for="meetingTitle">Tên Cuộc Họp <span style="color: red;">*</span></label>
                    <input type="text" id="meetingTitle" placeholder="Ví dụ: Họp Báo Cáo Quý III">
                </div>

                <div class="form-group">
                    <label for="unitName">Tên Đơn Vị <span style="color: red;">*</span></label>
                    <input type="text" id="unitName" placeholder="Ví dụ: Đảng ủy phường Trị An" value="Đảng ủy phường Trị An">
                </div>

                <div class="form-group">
                    <label for="meetingDate">Ngày Họp <span style="color: red;">*</span></label>
                    <input type="date" id="meetingDate">
                </div>

                <div class="form-group">
                    <label for="meetingTime">Giờ Họp <span style="color: red;">*</span></label>
                    <input type="time" id="meetingTime" value="09:00">
                </div>

                <div class="form-group">
                    <label for="location">Địa Điểm Họp <span style="color: red;">*</span></label>
                    <input type="text" id="location" placeholder="Ví dụ: Trụ Sở Phường Trị An">
                </div>

                <div class="form-group">
                    <label for="coordinates">GPS Tọa Độ (lat,lng) <span style="color: red;">*</span></label>
                    <input type="text" id="coordinates" placeholder="Ví dụ: 10.9472,106.8192">
                    <small style="color: #999; display: block; margin-top: 5px;">
                        💡 Lấy từ Google Maps: Click phải → Sao chép tọa độ
                    </small>
                </div>

                <button onclick="saveConfig()">💾 Lưu Cấu Hình & Tạo QR</button>
                <button class="btn-secondary" onclick="logout()">🚪 Đăng Xuất</button>

                <!-- QR Display -->
                <div class="qr-display" id="qrDisplay">
                    <h3 style="color: #333; margin-bottom: 15px;">📱 Mã QR Cuộc Họp</h3>
                    <img id="qrImage" src="" alt="QR Code">
                    <p style="font-weight: 600; color: #28a745; margin-top: 10px;">✅ Cấu hình thành công!</p>
                    <p style="margin-top: 10px;">URL để quét:</p>
                    <div class="qr-url" id="qrUrl"></div>
                    <div class="button-group">
                        <button onclick="downloadQR()" style="background: #28a745;">⬇️ Tải QR</button>
                        <button onclick="copyQRUrl()" style="background: #17a2b8;">📋 Copy URL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const ADMIN_PASSWORD = 'admin123';
        const DEBUG = true;

        // ============ LOGGING ============
        function log(msg, data = null) {
            if (DEBUG) {
                console.log(`[ADMIN] ${msg}`, data || '');
            }
        }

        // ============ CHECK PASSWORD ============
        function checkPassword() {
            log('🔐 checkPassword()');
            const password = document.getElementById('adminPassword').value;

            if (password === ADMIN_PASSWORD) {
                log('✓ Password correct');
                showSection('adminSection');
                loadConfigToForm();
            } else {
                log('❌ Password incorrect');
                showMessage('loginError', '❌ Mật khẩu sai. Vui lòng thử lại.');
                document.getElementById('adminPassword').value = '';
            }
        }

        // ============ LOAD CONFIG TO FORM ============
        function loadConfigToForm() {
            log('📥 loadConfigToForm()');
            const saved = localStorage.getItem('meetingConfig');
            if (saved) {
                try {
                    const config = JSON.parse(saved);
                    log('✓ Loaded config:', config);
                    document.getElementById('meetingTitle').value = config.meetingTitle || '';
                    document.getElementById('unitName').value = config.unitName || 'Đảng ủy phường Trị An';
                    document.getElementById('meetingDate').value = config.meetingDate || '';
                    document.getElementById('meetingTime').value = config.meetingTime || '09:00';
                    document.getElementById('location').value = config.location || '';
                    document.getElementById('coordinates').value = config.coordinates || '';
                } catch (e) {
                    log('⚠️ Error loading config:', e);
                }
            }
        }

        // ============ SAVE CONFIG ============
        function saveConfig() {
            log('💾 saveConfig()');
            
            const meetingTitle = document.getElementById('meetingTitle').value.trim();
            const unitName = document.getElementById('unitName').value.trim();
            const meetingDate = document.getElementById('meetingDate').value.trim();
            const meetingTime = document.getElementById('meetingTime').value.trim();
            const location = document.getElementById('location').value.trim();
            const coordinates = document.getElementById('coordinates').value.trim();

            // Validation
            if (!meetingTitle || !unitName || !meetingDate || !meetingTime || !location || !coordinates) {
                log('❌ Missing required fields');
                showMessage('configError', '❌ Vui lòng điền đầy đủ thông tin');
                return;
            }

            // Validate coordinates format
            if (!coordinates.match(/^[-\d.]+,[-\d.]+$/)) {
                log('❌ Invalid coordinates format');
                showMessage('configError', '❌ Tọa độ GPS không hợp lệ. Định dạng: lat,lng');
                return;
            }

            // Generate Meeting ID
            const meetingID = generateMeetingID();
            log('✓ Generated Meeting ID:', meetingID);

            // Create config object
            const config = {
                meetingID,
                meetingTitle,
                unitName,
                meetingDate,
                meetingTime,
                location,
                coordinates
            };

            // Save to localStorage
            localStorage.setItem('meetingConfig', JSON.stringify(config));
            log('✓ Config saved to localStorage');

            // Generate QR
            generateQR(meetingID);

            // Show success message
            showMessage('configSuccess', '✅ Cấu hình đã lưu thành công!');
        }

        // ============ GENERATE MEETING ID ============
        function generateMeetingID() {
            // Format: DIEMDANH-YYYYMMDD-HHMMSS-RANDOM
            const now = new Date();
            const dateStr = now.getFullYear() + 
                           String(now.getMonth() + 1).padStart(2, '0') + 
                           String(now.getDate()).padStart(2, '0');
            const timeStr = String(now.getHours()).padStart(2, '0') + 
                           String(now.getMinutes()).padStart(2, '0') + 
                           String(now.getSeconds()).padStart(2, '0');
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            return `DIEMDANH-${dateStr}-${timeStr}-${random}`;
        }

        // ============ GENERATE QR ============
        function generateQR(meetingID) {
            log('📱 generateQR():', meetingID);

            // URL để quét - phải là full URL tới checkin.html
            const checkInUrl = `https://greohu.github.io/Diemdanh/checkin.html?meeting=${meetingID}`;
            log('✓ Check-in URL:', checkInUrl);

            // Dùng QR Server API
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(checkInUrl)}`;
            log('✓ QR API URL:', qrApiUrl);

            // Display QR
            document.getElementById('qrImage').src = qrApiUrl;
            document.getElementById('qrUrl').textContent = checkInUrl;
            document.getElementById('qrDisplay').classList.add('show');

            // Store QR URL for download
            localStorage.setItem('lastQRUrl', checkInUrl);
        }

        // ============ DOWNLOAD QR ============
        function downloadQR() {
            log('⬇️ downloadQR()');
            const img = document.getElementById('qrImage');
            const link = document.createElement('a');
            link.href = img.src;
            link.download = `QR-${new Date().getTime()}.png`;
            link.click();
        }

        // ============ COPY QR URL ============
        function copyQRUrl() {
            log('📋 copyQRUrl()');
            const qrUrl = document.getElementById('qrUrl').textContent;
            navigator.clipboard.writeText(qrUrl).then(() => {
                showMessage('configSuccess', '✅ Đã copy URL vào clipboard');
            }).catch(err => {
                log('❌ Copy error:', err);
                showMessage('configError', '❌ Không thể copy. Vui lòng copy thủ công.');
            });
        }

        // ============ LOGOUT ============
        function logout() {
            log('🚪 logout()');
            document.getElementById('adminPassword').value = '';
            showSection('loginSection');
        }

        // ============ SHOW SECTION ============
        function showSection(sectionId) {
            log('👁️ showSection():', sectionId);
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        // ============ SHOW MESSAGE ============
        function showMessage(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.add('show');
            log('💬 Message:', message);
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // ============ KEYBOARD ============
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginSection').classList.contains('active')) {
                checkPassword();
            }
        });

        // ============ INITIALIZE ============
        window.addEventListener('load', () => {
            log('🚀 Admin panel loaded');
        });
    </script>
</body>
</html>
